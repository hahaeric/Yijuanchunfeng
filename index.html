<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f3ed" />
    <meta name="description" content="经日：从一句开始，按顺序慢读四书五经。" />
    <title>经日 · 四书五经慢读</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#today" aria-label="经日首页">
          <span class="brand-mark">经</span>
          <span class="brand-copy">
            <strong>经日</strong>
            <small>四书五经 · 日日读</small>
          </span>
        </a>

        <div class="nav-caption">阅读空间</div>
        <nav class="main-nav" aria-label="主导航">
          <button class="nav-item is-active" data-page="today" type="button">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4.5 5.5c2.8-.8 5.3-.4 7.5 1.2v12c-2.2-1.6-4.7-2-7.5-1.2zM19.5 5.5c-2.8-.8-5.3-.4-7.5 1.2v12c2.2-1.6 4.7-2 7.5-1.2z" /></svg>
            </span>
            <span>今日阅读</span>
            <span class="nav-dot" aria-hidden="true"></span>
          </button>
          <button class="nav-item" data-page="library" type="button">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M5 4.5h14v15H5zM8 8h8M8 11.5h8M8 15h5" /></svg>
            </span>
            <span>经书目录</span>
          </button>
          <button class="nav-item" data-page="saved" type="button">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M7 4.5h10v15l-5-3.5-5 3.5zM9.5 8h5" /></svg>
            </span>
            <span>收藏与笔记</span>
            <span class="nav-count" id="savedCount">0</span>
          </button>
        </nav>

        <div class="sidebar-bottom">
          <div class="sidebar-note">
            <span class="note-sun" aria-hidden="true">✳</span>
            <div>
              <strong>不求快读</strong>
              <p>每天读一点，慢慢读完整部经典。</p>
            </div>
          </div>
          <button class="settings-link" type="button" data-action="settings">
            <span class="settings-symbol" aria-hidden="true">⚙</span>
            阅读设置
          </button>
          <div class="profile-row">
            <span class="profile-avatar">知</span>
            <span class="profile-name">我的书桌</span>
            <span class="profile-more" aria-hidden="true">···</span>
          </div>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumbs" id="breadcrumbs">阅读空间 <span>/</span> 今日阅读</div>
          <div class="topbar-right">
            <span class="demo-indicator"><i></i> 本地演示数据</span>
            <button class="top-icon-button" type="button" data-action="settings" aria-label="阅读设置" title="阅读设置">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zM19 13.5a7.4 7.4 0 0 0 0-3l1.6-1.2-1.7-2.9-1.9.8a7.4 7.4 0 0 0-2.6-1.5L14.1 3h-3.3l-.3 2.7a7.4 7.4 0 0 0-2.6 1.5L6 6.4 4.3 9.3 6 10.5a7.4 7.4 0 0 0 0 3l-1.7 1.2L6 17.6l1.9-.8a7.4 7.4 0 0 0 2.6 1.5l.3 2.7h3.3l.3-2.7a7.4 7.4 0 0 0 2.6-1.5l1.9.8 1.7-2.9z" /></svg>
            </button>
            <span class="top-avatar" aria-label="读者">知</span>
          </div>
        </header>

        <div class="page-container" id="appView" aria-live="polite"></div>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div id="modalRoot"></div>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
